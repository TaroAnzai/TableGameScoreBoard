# Maestro-only, non-secret settings. Runtime credentials and API URLs are read
# from the project-root .env by scripts/maestro-test.sh.
flows:
  # The pattern is evaluated from the directory passed to `maestro test`.
  # `**` supports both `.maestro/tests/p0` and `.maestro/tests` invocations.
  - '*'

env:
  APP_ID: com.anzaihome.mahjongapp.dev
  APP_SCHEME: mahjongapp-dev
  MAESTRO_FIXTURE_NAME_PREFIX: Maestro E2E
  MAESTRO_FIXTURE_EMAIL_PREFIX: maestro-e2e

  # Calendar selections in the stats flow are UI settings, not server fixtures.
  STATS_YEAR: '2026'
  STATS_START_DATE: '2026-01-10'
  STATS_END_BEFORE_START: '2026-01-09'
  STATS_END_DATE: '2026-01-20'
  EMPTY_PERIOD_START_DATE: '2026-02-01'
  EMPTY_PERIOD_END_DATE: '2026-02-02'

  # The public API cannot seed app-local pending-group storage or control
  # approval/expiry; these are only display labels for pending-groups.yaml.
  PENDING_GROUP_A_NAME: Maestro pending A
  PENDING_GROUP_B_NAME: Maestro pending B
  EXPIRED_PENDING_GROUP_NAME: Maestro pending expired
