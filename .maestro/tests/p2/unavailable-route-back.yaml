appId: ${APP_ID}
name: P2 - 存在しないデータと未定義ルートからホームへ戻る
tags:
  - p2
  - navigation
  - deep-link
---
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow: ../../flows/common/clear-app-data-and-select-japanese.yaml

- openLink:
    link: ${APP_SCHEME}://mahjong/tournament/not-a-valid-share-key
- extendedWaitUntil:
    visible: '大会が見つかりませんでした.*'
    timeout: 30000
- tapOn: '戻る'
- assertVisible: '登録グループ一覧'

- openLink:
    link: ${APP_SCHEME}://mahjong/table/not-a-valid-share-key
- extendedWaitUntil:
    visible: '記録表が見つかりませんでした.*'
    timeout: 30000
- tapOn: '戻る'
- assertVisible: '登録グループ一覧'

- openLink:
    link: ${APP_SCHEME}://mahjong/route-that-does-not-exist
- extendedWaitUntil:
    visible: 'リンクを開けませんでした.*'
    timeout: 30000
- tapOn: 'ホームに戻る'
- assertVisible: '登録グループ一覧'
