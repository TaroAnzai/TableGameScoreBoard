appId: ${APP_ID}
name: P0 - VIEW・EDIT・OWNER の権限制御
tags:
  - p0
  - permissions
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: access-control
        FIXTURE_GROUP_COUNT: '1'
        FIXTURE_PLAYER_COUNT: '0'
        FIXTURE_CREATE_GAME: 'false'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
# 安全な立ち上げ launchApp 代替
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}

- runFlow: ../../flows/common/select-japanese.yaml
- runFlow: access-control/check-tournament-permissions.yaml
- runFlow: access-control/check-owner-permissions.yaml
- runFlow: access-control/check-table-permissions.yaml
# この UI 確認に加え、CI は同じ fixture キーでバックエンドの permission contract test を実行する。
