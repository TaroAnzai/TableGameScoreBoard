appId: ${APP_ID}
name: P0 - VIEW・EDIT・OWNER の権限制御
tags:
  - p0
  - permissions
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: access-control
        FIXTURE_GROUP_COUNT: '1'
        FIXTURE_PLAYER_COUNT: '0'
        FIXTURE_CREATE_GAME: 'false'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
# 安全な立ち上げ launchApp 代替
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}

# VIEW は編集 UI を提供せず、EDIT/OWNER は編集 UI を提供する。
- runFlow: ../../flows/common/select-japanese.yaml
- openLink:
    link: ${output.fixture.tournamentViewLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertNotVisible: '${output.fixture.tournamentName}を編集'
- assertNotVisible: '参加者を追加'
- assertNotVisible: '参加者を削除'
- assertVisible:
    text: '記録用紙を新規作成'
    enabled: false

- openLink:
    link: ${output.fixture.tournamentEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertVisible: '${output.fixture.tournamentName}を編集'
- assertVisible: '参加者を削除'
- assertVisible: '参加者を追加'
- assertVisible:
    text: '記録用紙を新規作成'
    enabled: true

# OWNER 専用の大会削除は、グループ画面で確認する。
- openLink:
    link: ${output.fixture.groupEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- assertNotVisible: '大会削除'

- openLink:
    link: ${output.fixture.groupOwnerLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- assertVisible: '大会削除'

# 親（大会）キーから開いた卓に、親リンクの VIEW 権限が引き継がれる。
- openLink:
    link: ${output.fixture.tableViewLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.tableName}
    timeout: 30000
- assertNotVisible: '${output.fixture.tableName}を編集'
- assertNotVisible: '参加者を追加'
- assertVisible:
    text: '対局データを削除'
    enabled: false

# EDIT 親キーから開いた卓では編集できる。
- openLink:
    link: ${output.fixture.tableEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.tableName}
    timeout: 30000
- assertVisible: '${output.fixture.tableName}を編集'
- assertVisible: '参加者を追加'
# この UI 確認に加え、CI は同じ fixture キーでバックエンドの permission contract test を実行する。
