appId: ${APP_ID}
name: P0 - 共有リンクを保存・再利用・削除できる
tags:
  - p0
  - saved-links
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: shared-link-saved-pages
        FIXTURE_GROUP_COUNT: '1'
        FIXTURE_PLAYER_COUNT: '0'
        FIXTURE_CREATE_GAME: 'false'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
# 安全な立ち上げ launchApp 代替
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
# 保存済み共有リンクを全削除し、日本語を選択してから開始する。
- runFlow: ../../flows/common/clear-app-data-and-select-japanese.yaml
- runFlow: shared-link-saved-pages/check-dismissed-prompt.yaml
- runFlow: shared-link-saved-pages/save-shared-pages.yaml
- runFlow: shared-link-saved-pages/reopen-saved-page.yaml
- runFlow: shared-link-saved-pages/delete-saved-pages.yaml
