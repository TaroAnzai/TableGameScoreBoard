appId: ${APP_ID}
name: P0 - 共有リンクを保存・再利用・削除できる
tags:
  - p0
  - saved-links
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: shared-link-saved-pages
        FIXTURE_GROUP_COUNT: '1'
        FIXTURE_PLAYER_COUNT: '0'
        FIXTURE_CREATE_GAME: 'false'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
# 安全な立ち上げ launchApp 代替
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
# 保存済み共有リンクを全削除し、日本語を選択してから開始する。
- runFlow: ../../flows/common/clear-app-data-and-select-japanese.yaml
- openLink:
    link: ${output.fixture.tournamentViewLink}
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertVisible: '保存せず続行'
- tapOn: '保存せず続行'
- assertNotVisible: '保存せず続行'

# 同一プロセス内ではキャンセル済みページの促進モーダルが再表示されない。
- openLink:
    link: ${output.fixture.tournamentViewLink}
- assertNotVisible: '保存せず続行'

# 再起動すると未保存ページとして再び促進され、保存できる。
- stopApp
- launchApp
- assertVisible: '麻雀大会 集計'
- openLink:
    link: ${output.fixture.tournamentViewLink}
- assertVisible: '保存せず続行'
- tapOn: '保存する'
- assertNotVisible: '保存せず続行'

# 卓について同じ保存フローを実施する。
- openLink:
    link: ${output.fixture.tableViewLink}
- extendedWaitUntil:
    visible: ${output.fixture.tableName}
    timeout: 30000
- assertVisible: '保存せず続行'
- tapOn: '保存する'
- assertNotVisible: '保存せず続行'

# アプリ再起動後、保存済み一覧から大会を開く。開いた項目は最終表示順の先頭になる。
- stopApp
- launchApp
- assertVisible: '麻雀大会 集計'
- tapOn: '保存済み'
- assertVisible: '保存済みページ'
- assertVisible: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- assertVisible: '${output.fixture.tableName}, ${output.fixture.groupName} / ${output.fixture.tournamentName}, 閲覧'
- tapOn: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertVisible: '大会成績'
- tapOn: '保存済み'
- assertVisible: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'

# 長押し削除後、一覧から消える。卓も同様に削除する。
- longPressOn: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertVisible: '保存済みページ'
- longPressOn: '${output.fixture.tableName}, ${output.fixture.groupName} / ${output.fixture.tournamentName}, 閲覧'
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertVisible: '保存済みページ'
- assertNotVisible: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- assertNotVisible: '${output.fixture.tableName}, ${output.fixture.groupName} / ${output.fixture.tournamentName}, 閲覧'
- assertVisible: '保存済みの大会・卓はありません'
