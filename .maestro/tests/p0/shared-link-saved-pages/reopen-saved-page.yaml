appId: ${APP_ID}
---
# 保存済み一覧から大会を開き、最終表示順の先頭になることを確認する。
- stopApp
- runFlow:
    file: ../../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
- tapOn: '保存済み'
- assertVisible: '保存済みページ'
- assertVisible: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- assertVisible: '${output.fixture.tableName}, ${output.fixture.groupName} / ${output.fixture.tournamentName}, 閲覧'
- tapOn: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertVisible: '大会成績'
- tapOn: '保存済み'
- assertVisible: '${output.fixture.tournamentName}, ${output.fixture.groupName}, 閲覧'
- tapOn: '保存済み'
- assertNotVisible: '保存済みページ'
