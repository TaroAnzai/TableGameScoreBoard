appId: ${APP_ID}
---
# OWNER 専用の大会削除は、グループ画面で確認する。
- openLink:
    link: ${output.fixture.groupEditLink}
- runFlow: ../../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- tapOn: '大会一覧'
- assertNotVisible: '大会削除'

- stopApp
- runFlow:
    file: ../../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}

- openLink:
    link: ${output.fixture.groupOwnerLink}
- runFlow: ../../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- tapOn: '大会一覧'
- assertVisible: '大会削除'
