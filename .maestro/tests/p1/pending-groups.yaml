appId: ${APP_ID}
name: P1 - 承認待ちグループの同期
tags:
  - p1
  - pending-groups
onFlowStart:
  - runScript: ../../scripts/prepare-pending-groups.js
  - runScript:
      file: ../../scripts/set-network-mode.js
      env:
        MODE: pending-reset
onFlowComplete:
  - runScript: ../../fixtures/teardown/delete-group.js
  - runScript:
      file: ../../scripts/set-network-mode.js
      env:
        MODE: pending-reset
---
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow: ../../flows/common/select-japanese.yaml
- runFlow: pending-groups/create-requests.yaml
- runFlow: pending-groups/approve-one-request.yaml
- runFlow: pending-groups/verify-concurrent-refresh.yaml
- runFlow: pending-groups/expire-request.yaml
