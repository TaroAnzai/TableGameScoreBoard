appId: ${APP_ID}
name: P1 - 削除確認・集計・遷移・保存リンク整理
tags:
  - p1
  - deletion
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: deletion-flows
        FIXTURE_GROUP_COUNT: '1'
        FIXTURE_PLAYER_COUNT: '4'
        FIXTURE_CREATE_GAME: 'true'
        FIXTURE_CREATE_EXTRA_TABLE: 'true'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
- launchApp
- runFlow: ../../flows/common/select-japanese.yaml
- openLink:
    link: ${output.fixture.tableEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.tableName}
    timeout: 30000

# 対局削除ダイアログのキャンセルは状態を変えない。
- tapOn: '対局データを削除'
- tapOn: '第1局'
- assertVisible: 'ゲーム削除'
- tapOn: 'キャンセル'
- assertVisible: '100'

# 確定後は卓から消え、親大会の集計も更新される。
- tapOn: '対局データを削除'
- tapOn: '第1局'
- tapOn: 'OK'
- assertNotVisible: '100'
- tapOn: '上の階層へ移動'
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- assertNotVisible: '100'

# 保存した卓を親大会から削除すると大会画面へ遷移する。
- openLink:
    link: ${output.fixture.tableEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- tapOn: '記録表削除'
- assertVisible: '記録表削除'
- tapOn: 'OK'
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000

# 直接リンクで開いた卓を削除した場合はホームへ戻る。
- openLink:
    link: ${output.fixture.directDeleteTableLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.directDeleteTableName}
    timeout: 30000
- tapOn: '記録表削除'
- tapOn: 'OK'
- extendedWaitUntil:
    visible: '登録グループ一覧'
    timeout: 30000

# 大会削除後はグループ一覧から消え、保存済みページにも残らない。
- openLink:
    link: ${output.fixture.groupOwnerLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- tapOn: '大会削除'
- tapOn: ${output.fixture.tournamentName}
- tapOn: 'OK'
- assertNotVisible: ${output.fixture.tournamentName}
- tapOn: '保存済み'
- assertNotVisible: ${output.fixture.tournamentName}
