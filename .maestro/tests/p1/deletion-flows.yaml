appId: ${APP_ID}
name: P1 - ゲーム・記録表・大会・登録グループ削除
tags:
  - p1
  - deletion
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: deletion-flows
        FIXTURE_GROUP_COUNT: '2'
        FIXTURE_PLAYER_COUNT: '4'
        FIXTURE_SECOND_GROUP_PLAYER_COUNT: '4'
        FIXTURE_CREATE_GAME: 'true'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
# 安全な立ち上げ launchApp 代替
- runFlow:
    file: ../../flows/common/launch-app-check.yaml
    env:
      APP_ID: ${APP_ID}
- runFlow: ../../flows/common/select-japanese.yaml
- runFlow: deletion-flows/delete-direct-game.yaml
- runFlow: deletion-flows/delete-direct-resources.yaml
- runFlow: deletion-flows/open-nested-game.yaml
- runFlow: deletion-flows/delete-nested-game-and-table.yaml
- runFlow: deletion-flows/delete-nested-tournament-and-registration.yaml
