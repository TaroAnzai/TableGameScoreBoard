appId: ${APP_ID}
name: P1 - ゲーム・記録表・大会・登録グループ削除
tags:
  - p1
  - deletion
onFlowStart:
  - runScript:
      file: ../../fixtures/setup/create-test-data.js
      env:
        FIXTURE_LABEL: deletion-flows
        FIXTURE_GROUP_COUNT: '2'
        FIXTURE_PLAYER_COUNT: '4'
        FIXTURE_SECOND_GROUP_PLAYER_COUNT: '4'
        FIXTURE_CREATE_GAME: 'true'
        FIXTURE_CREATE_EXTRA_TABLE: 'false'
        FIXTURE_ADD_INVALID_LINK: 'false'
onFlowComplete:
  - runScript:
      file: ../../fixtures/teardown/delete-group.js
---
- launchApp
- runFlow: ../../flows/common/select-japanese.yaml

# Series A: register the group, then open each resource by its direct link.
- openLink:
    link: ${output.fixture.groupOwnerLink}
- extendedWaitUntil:
    visible: ${output.fixture.groupName}
    timeout: 30000
- runFlow:
    when:
      visible: 'アプリに登録'
    commands:
      - tapOn: 'アプリに登録'
      - assertVisible: '登録グループ追加'
      - tapOn: 'OK'
- runFlow: ../../flows/common/open-app.yaml
- assertVisible: ${output.fixture.groupName}

# Cancelling game deletion leaves the persisted game row in place.
- openLink:
    link: ${output.fixture.tableEditLink}
- runFlow: ../../flows/common/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible:
      id: 'game-row-${output.fixture.gameId}'
    timeout: 30000
- tapOn: '対局データを削除'
- tapOn:
    id: 'select-${output.fixture.gameId}'
- assertVisible: 'ゲーム削除'
- tapOn: 'キャンセル'
- tapOn:
    id: select-close
- assertVisible:
    id: 'game-row-${output.fixture.gameId}'

# Confirming deletion removes the persisted row, while the empty first input row remains.
- tapOn: '対局データを削除'
- tapOn:
    id: 'select-${output.fixture.gameId}'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible:
      id: 'game-row-${output.fixture.gameId}'
    timeout: 30000
- assertVisible:
    id: empty-game-row-0
- assertVisible:
    text: '対局データを削除'
    enabled: false

# A directly opened table has no parent route and returns home after deletion.
- tapOn: '記録表削除'
- assertVisible: '記録表削除'
- tapOn: 'OK'
- extendedWaitUntil:
    visible: '登録グループ一覧'
    timeout: 30000
- openLink:
    link: ${output.fixture.tableEditLink}
- extendedWaitUntil:
    visible: '卓が見つかりませんでした'
    timeout: 30000

# Tournament deletion is exposed by the parent group, not by the tournament page.
- openLink:
    link: ${output.fixture.groupOwnerLink}
- extendedWaitUntil:
    visible: ${output.fixture.tournamentName}
    timeout: 30000
- tapOn: '大会削除'
- tapOn:
    id: 'select-${output.fixture.tournamentId}'
- assertVisible: '大会削除'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible: ${output.fixture.tournamentName}
    timeout: 30000
- openLink:
    link: ${output.fixture.tournamentOwnerLink}
- extendedWaitUntil:
    visible: '大会が見つかりませんでした。削除されたか、URLが正しくない可能性があります。'
    timeout: 30000

# Removing a registered group only removes its local registration.
- runFlow: ../../flows/common/open-app.yaml
- tapOn: '登録グループを削除'
- tapOn:
    id: 'select-${output.fixture.groupId}'
- assertVisible: '登録グループから削除'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible: ${output.fixture.groupName}
    timeout: 30000

# Series B: enter through the group and retain parent route parameters while descending.
- openLink:
    link: ${output.fixture.groupBOwnerLink}
- extendedWaitUntil:
    visible: ${output.fixture.groupBName}
    timeout: 30000
- runFlow:
    when:
      visible: 'アプリに登録'
    commands:
      - tapOn: 'アプリに登録'
      - assertVisible: '登録グループ追加'
      - tapOn: 'OK'
- runFlow: ../../flows/common/open-app.yaml
- assertVisible: ${output.fixture.groupBName}
- tapOn: ${output.fixture.groupBName}
- extendedWaitUntil:
    visible: ${output.fixture.tournamentBName}
    timeout: 30000
- tapOn: ${output.fixture.tournamentBName}
- extendedWaitUntil:
    visible:
      id: 'score-table-${output.fixture.tableBId}'
    timeout: 30000
- tapOn:
    id: 'score-table-${output.fixture.tableBId}'
- extendedWaitUntil:
    visible:
      id: 'game-row-${output.fixture.gameBId}'
    timeout: 30000

# Repeat cancel and confirm through the parent-aware route.
- tapOn: '対局データを削除'
- tapOn:
    id: 'select-${output.fixture.gameBId}'
- assertVisible: 'ゲーム削除'
- tapOn: 'キャンセル'
- tapOn:
    id: select-close
- assertVisible:
    id: 'game-row-${output.fixture.gameBId}'
- tapOn: '対局データを削除'
- tapOn:
    id: 'select-${output.fixture.gameBId}'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible:
      id: 'game-row-${output.fixture.gameBId}'
    timeout: 30000
- assertVisible:
    id: empty-game-row-0

# Parent route parameters return the app to the tournament after table deletion.
- tapOn: '記録表削除'
- tapOn: 'OK'
- extendedWaitUntil:
    visible: ${output.fixture.tournamentBName}
    timeout: 30000
- assertNotVisible:
    id: 'score-table-${output.fixture.tableBId}'

# Return to the group and delete the now-empty tournament.
- tapOn: '戻る'
- extendedWaitUntil:
    visible: ${output.fixture.groupBName}
    timeout: 30000
- tapOn: '大会削除'
- tapOn:
    id: 'select-${output.fixture.tournamentBId}'
- assertVisible: '大会を削除'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible: ${output.fixture.tournamentBName}
    timeout: 30000
- tapOn: '大会削除'
- assertVisible: '削除できる大会がありません。'
- tapOn:
    id: select-close

# Finally remove the second group's local registration.
- tapOn: '戻る'
- extendedWaitUntil:
    visible: '登録グループ一覧'
    timeout: 30000
- tapOn: '登録グループを削除'
- tapOn:
    id: 'select-${output.fixture.groupBId}'
- assertVisible: '登録グループから削除'
- tapOn: 'OK'
- extendedWaitUntil:
    notVisible: ${output.fixture.groupBName}
    timeout: 30000
