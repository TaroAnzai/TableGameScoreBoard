# 保存済み共有リンクが空である必要があるフロー用の共通前提。
# 開発ビルドの defaultLaunchURL を維持するため `clearState` は使用しない。
# 保存済みページの先頭項目を長押し削除し、一覧が空になるまで繰り返す。
# 前提: アプリが起動済みであること。
appId: ${APP_ID}
---
- runFlow: select-japanese.yaml
- tapOn: '保存済み'
- repeat:
    while:
      visible:
        id: saved-link-0
    commands:
      - longPressOn:
          id: saved-link-0
      - assertVisible: '保存済みページを削除'
      - tapOn: 'OK'
      - waitForAnimationToEnd
      - tapOn: '保存済み'
- runFlow:
    when:
      notVisible: '保存済みページ'
    commands:
      - tapOn: '保存済み'
- assertVisible: '保存済みの大会・卓はありません'
- tapOn: '保存済み'
