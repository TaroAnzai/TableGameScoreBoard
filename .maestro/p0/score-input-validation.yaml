appId: ${APP_ID}
name: P0 - 点数入力の異常系と再試行
tags:
  - p0
  - scores
---
# 前提: SCORE_TABLE_EDIT_LINK は参加者4人を持つ通常卓。
#       SCORE_FAILURE_TABLE_EDIT_LINK は、最初の保存だけ 5xx を返す E2E fixture。
- launchApp
- assertVisible: '麻雀大会 集計'
- openLink:
    link: ${SCORE_TABLE_EDIT_LINK}
- runFlow: ../flows/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${SCORE_TABLE_NAME}
    timeout: 30000
- tapOn: '第1局のスコアを編集'

# 4人でも合計が0でなければ確定不可。
- tapOn: '${PLAYER_1}の点数'
- inputText: '100'
- tapOn: '${PLAYER_2}の点数'
- inputText: '-100'
- tapOn: '${PLAYER_3}の点数'
- inputText: '1'
- tapOn: '${PLAYER_4}の点数'
- inputText: '0'
- assertVisible: '通常卓の合計は0にしてください'
- assertVisible:
    text: '確定'
    enabled: false

# 合計0なら確定可能。二重タップしても1局だけ作成される。
- tapOn: '${PLAYER_3}の点数'
- tapOn: '${PLAYER_4}の点数'
- inputText: '-1'
- assertVisible: '合計: 0'
- tapOn: '確定'
- tapOn:
    text: '確定'
    optional: true
- assertVisible: '100'

# 失敗時はモーダルと入力を保持し、再試行しても重複局を作らない。
- tapOn: '第1局のスコアを編集'
- tapOn: '${PLAYER_1}の点数'
- inputText: '200'
- tapOn: '${PLAYER_2}の点数'
- inputText: '-200'
- tapOn: '${PLAYER_3}の点数'
- inputText: '0'
- tapOn: '${PLAYER_4}の点数'
- inputText: '0'
- setAirplaneMode: enabled
- tapOn: '確定'
- stopApp
- launchApp
- assertVisible: '麻雀大会 集計'
- openLink:
    link: ${SCORE_TABLE_EDIT_LINK}
- runFlow: ../flows/dismiss-save-page-prompt.yaml
- extendedWaitUntil:
    visible: ${SCORE_TABLE_NAME}
    timeout: 30000
- assertVisible: '${PLAYER_1}の点数'
- assertVisible: '100'
- tapOn: '確定'
- assertVisible: '100'
- assertNotVisible: '第2局のスコアを編集'
