appId: ${APP_ID}
name: P0 - 共有リンクを保存・再利用・削除できる
tags:
  - p0
  - saved-links
---
# 前提: TOURNAMENT_DIRECT_LINK と TABLE_DIRECT_LINK は、それぞれ未保存の実在する VIEW/EDIT/OWNER リンク。
#       実行前にアプリデータをクリアし、日本語を選択する。
- launchApp
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- extendedWaitUntil:
    visible: ${TOURNAMENT_NAME}
    timeout: 30000
- assertVisible: 'このページを保存しますか？'
- tapOn: '保存せず続行'
- assertNotVisible: 'このページを保存しますか？'

# 同一プロセス内ではキャンセル済みページの促進モーダルが再表示されない。
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- assertNotVisible: 'このページを保存しますか？'

# 再起動すると未保存ページとして再び促進され、保存できる。
- stopApp
- launchApp
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- assertVisible: 'このページを保存しますか？'
- tapOn: '保存する'
- assertNotVisible: 'このページを保存しますか？'

# 卓について同じ保存フローを実施する。
- openLink:
    link: ${TABLE_DIRECT_LINK}
- extendedWaitUntil:
    visible: ${TABLE_NAME}
    timeout: 30000
- assertVisible: 'このページを保存しますか？'
- tapOn: '保存する'
- assertNotVisible: 'このページを保存しますか？'

# アプリ再起動後、保存済み一覧から大会を開く。開いた項目は最終表示順の先頭になる。
- stopApp
- launchApp
- tapOn: '保存済み'
- assertVisible: '保存済みページ'
- assertVisible: ${TOURNAMENT_NAME}
- assertVisible: ${TABLE_NAME}
- tapOn: ${TOURNAMENT_NAME}
- extendedWaitUntil:
    visible: ${TOURNAMENT_NAME}
    timeout: 30000
- tapOn: '保存済み'
- assertVisible:
    id: saved-link-0
    text: ${TOURNAMENT_NAME}

# 長押し削除後、一覧から消える。卓も同様に削除する。
- longPressOn: ${TOURNAMENT_NAME}
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertNotVisible: ${TOURNAMENT_NAME}
- longPressOn: ${TABLE_NAME}
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertNotVisible: ${TABLE_NAME}
- assertVisible: '保存済みの大会・卓はありません'
