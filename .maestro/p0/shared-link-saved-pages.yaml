appId: ${APP_ID}
name: P0 - 共有リンクを保存・再利用・削除できる
tags:
  - p0
  - saved-links
---
# 前提: TOURNAMENT_DIRECT_LINK と TABLE_DIRECT_LINK は、それぞれ未保存の実在する VIEW/EDIT/OWNER リンク。
#       保存済み共有リンクを全削除し、日本語を選択してから開始する。
- runFlow: ../flows/clear-app-data-and-select-japanese.yaml
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- extendedWaitUntil:
    visible: ${TOURNAMENT_NAME}
    timeout: 30000
- assertVisible: '保存せず続行'
- tapOn: '保存せず続行'
- assertNotVisible: '保存せず続行'

# 同一プロセス内ではキャンセル済みページの促進モーダルが再表示されない。
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- assertNotVisible: '保存せず続行'

# 再起動すると未保存ページとして再び促進され、保存できる。
- stopApp
- launchApp
- assertVisible: '麻雀大会 集計'
- openLink:
    link: ${TOURNAMENT_DIRECT_LINK}
- assertVisible: '保存せず続行'
- tapOn: '保存する'
- assertNotVisible: '保存せず続行'

# 卓について同じ保存フローを実施する。
- openLink:
    link: ${TABLE_DIRECT_LINK}
- extendedWaitUntil:
    visible: ${TABLE_NAME}
    timeout: 30000
- assertVisible: '保存せず続行'
- tapOn: '保存する'
- assertNotVisible: '保存せず続行'

# アプリ再起動後、保存済み一覧から大会を開く。開いた項目は最終表示順の先頭になる。
- stopApp
- launchApp
- assertVisible: '麻雀大会 集計'
- tapOn: '保存済み'
- assertVisible: '保存済みページ'
- assertVisible: '${TOURNAMENT_NAME}, ${GROUP_NAME}, 閲覧'
- assertVisible: '${TABLE_NAME}, ${GROUP_NAME} / ${TOURNAMENT_NAME}, 閲覧'
- tapOn: '${TOURNAMENT_NAME}, ${GROUP_NAME}, 閲覧'
- extendedWaitUntil:
    visible: ${TOURNAMENT_NAME}
    timeout: 30000
- assertVisible: '大会成績'
- tapOn: '保存済み'
- assertVisible: '${TOURNAMENT_NAME}, ${GROUP_NAME}, 閲覧'

# 長押し削除後、一覧から消える。卓も同様に削除する。
- longPressOn: '${TOURNAMENT_NAME}, ${GROUP_NAME}, 閲覧'
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertVisible: '保存済みページ'
- longPressOn: '${TABLE_NAME}, ${GROUP_NAME} / ${TOURNAMENT_NAME}, 閲覧'
- assertVisible: '保存済みページを削除'
- tapOn: 'OK'
- assertVisible: '保存済みページ'
- assertNotVisible: '${TOURNAMENT_NAME}, ${GROUP_NAME}, 閲覧'
- assertNotVisible: '${TABLE_NAME}, ${GROUP_NAME} / ${TOURNAMENT_NAME}, 閲覧'
- assertVisible: '保存済みの大会・卓はありません'
