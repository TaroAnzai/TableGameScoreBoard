appId: com.anonymous.mahjongmobile
---
- runScript: scripts/create-group-fixture.js
- runFlow: lunch-test.yaml

- tapOn: '新しいグループを作成'

- tapOn:
    id: 'primaryInput'
- inputText: ${output.groupName}

- tapOn:
    id: 'twoInput'
- inputText: ${output.email}

- tapOn: 'OK'

- extendedWaitUntil:
    visible: 'グループ作成用メールを送信しました'
    timeout: 30000
- tapOn: 'OK'

- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/get-group-creation-link.js
          env:
            MAILHOG_URL: 'http://localhost:8025'

- openLink:
    link: ${output.deepLink}

- extendedWaitUntil:
    visible: ${output.groupName}
    timeout: 30000

- tapOn: '上の階層へ移動'

- extendedWaitUntil:
    visible: '麻雀大会 集計'
    timeout: 30000
- assertVisible: ${output.groupName}
- assertVisible: ${output.createdAtLabel}
