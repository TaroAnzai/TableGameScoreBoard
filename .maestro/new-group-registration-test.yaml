appId: com.anzaihome.mahjongapp.dev
---
- runScript: scripts/create-group-fixture.js
- runScript:
    file: scripts/request-group-creation-link.js
    env:
      API_BASE_URL: 'http://localhost:6080'

- launchApp

- extendedWaitUntil:
    visible: '麻雀大会 集計'
    timeout: 30000
- openLink:
    link: ${output.deepLink}

- extendedWaitUntil:
    visible: ${output.groupName}
    timeout: 30000

- openLink:
    link: 'mahjongapp-dev://'

- extendedWaitUntil:
    visible: '麻雀大会 集計'
    timeout: 30000
- assertVisible: '登録グループ一覧'
- scrollUntilVisible:
    element: ${output.groupName}
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- assertVisible: ${output.createdAtLabel}
